// zzqAI 对照组：M5/M6 全部关闭，行为应完全退回原版（无难度调整、无情报共享）
// 用法: quake3e-vulkan.x64.exe +set fs_game brainworks +set logfile 1 +set g_gametype 3 +devmap q3dm6 +exec m56control.cfg
set bot_enable 1
set fraglimit 0
set timelimit 0
set team_autoJoin 1

set bot_adaptive 0
set bot_adaptive_debug 1

set bot_share 0
set bot_share_debug 1

addbot zzqBOT 2 red  0 ^1zzqBOT^7-^4Low1
addbot zzqBOT 2 red  0 ^1zzqBOT^7-^4Low2
addbot zzqBOT 4 blue 0 ^4zzqBOT^7-^1High1
addbot zzqBOT 4 blue 0 ^4zzqBOT^7-^1High2

wait 2200
echo ================ CONTROL REPORT A ================
bot_adaptive_report 1
bot_share_report 1
wait 60
wait 2200
echo ================ CONTROL REPORT B ================
bot_adaptive_report 1
bot_share_report 1
wait 60
quit
