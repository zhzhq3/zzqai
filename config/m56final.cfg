// zzqAI 端到端验证：M5 + M6 双开（2026-10-09）
// 用法: quake3e-vulkan.x64.exe +set fs_game brainworks +set logfile 1 +set g_gametype 3 +devmap q3dm6 +exec m56final.cfg
set bot_enable 1
set fraglimit 0
set timelimit 0
set team_autoJoin 1

// M5 难度伺服
set bot_adaptive 1
set bot_adaptive_debug 1
set bot_adaptive_interval 4
// M6 团队情报
set bot_share 1
set bot_share_debug 1
set bot_share_lifetime 10
set bot_share_range 4000

addbot zzqBOT 2 red  0 ^1zzqBOT^7-^4Red1
addbot zzqBOT 3 red  0 ^1zzqBOT^7-^4Red2
addbot zzqBOT 4 blue 0 ^4zzqBOT^7-^1Blue1
addbot zzqBOT 5 blue 0 ^4zzqBOT^7-^1Blue2

wait 2500
echo ================ E2E REPORT A ================
bot_adaptive_report 1
bot_share_report 1
wait 60
wait 2500
echo ================ E2E REPORT B ================
bot_adaptive_report 1
bot_share_report 1
wait 60
quit
