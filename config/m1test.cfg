// zzqAI M1/M2 验证（2026-10-09）
// 用法: quake3e-vulkan.x64.exe +set fs_game brainworks +set logfile 1 +devmap q3dm4 +exec m1test.cfg
set bot_enable 1
set g_spSkill 4
set fraglimit 0
set timelimit 0

// M1 对手档案 + M2 物品等待
set bot_profile 1
set bot_profile_debug 0
set bot_item_wait 2
set bot_item_wait_diag 1

addbot zzqBOT 4 "" 0 ^1AI^7-^4One
addbot zzqBOT 4 "" 0 ^1AI^7-^4Two
addbot default 4 "" 0 ^1AI^7-^4Gro

wait 1500
echo ================ M1 REPORT 1 ================
bot_profile_debug 1
wait 60
echo ================ CVAR CHECK ================
bot_item_wait
bot_profile
bot_profile_debug
wait 60
echo ================ M1 REPORT 2 ================
bot_profile_debug 1
wait 1500
echo ================ M1 REPORT 3 ================
bot_profile_debug 1
wait 60
quit
