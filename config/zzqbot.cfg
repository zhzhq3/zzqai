//===========================================================================
// zzqBOT 模式  (2026-10-09)
// 用法：在控制台执行   exec zzqbot.cfg
//       或在命令行   +devmap q3dm4 +exec zzqbot.cfg
// 说明：3 个 zzqBOT 机器人（最高难度技能5）+ 伤害数字 + zzqAI 对手档案/物品占位
//===========================================================================

// ---- 伤害数字（由自编译的 cgame.qvm 提供）----
set cg_damageNumbers 1
set cg_damageNumbersScale 1
set cg_damageNumbersDebug 0

// ---- zzqAI M1：对手档案（2026-10-09）----
// 机器人会记住每个对手的常出没区域，丢失敌人后朝最可能的方位搜索。
set bot_profile 1
// 想打印所有玩家的画像报告，把下面这行改成 1（只打印一次）
set bot_profile_debug 0

// ---- zzqAI M2：高价值物品提前占位 ----
// 允许机器人比物品刷新时刻提前这么多秒到达并在原地等待（0 = 关闭）
set bot_item_wait 2
// 打印"提前占位"诊断（会刷屏，平时 0）
set bot_item_wait_diag 0

// ---- 机器人 ----
set bot_enable 1
set g_spSkill 5

// 注意：以上 bot_* 都是作弊保护 cvar，普通开局改不动它们；
// 想现场调参请用 devmap 开图（自动开启作弊）。

// zzqBOT x3（第 5 个参数是显示用别名，避免重名）
addbot zzqBOT 5 "" 0 ^1zzqBOT^7-^4Alpha
addbot zzqBOT 5 "" 0 ^1zzqBOT^7-^4Beta
addbot zzqBOT 5 "" 0 ^1zzqBOT^7-^4Gamma

echo "^1zzqBOT mode loaded. ^7Damage numbers ON. zzqAI M1+M2 ON. 3 bots added."
