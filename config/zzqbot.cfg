//===========================================================================
// zzqBOT 模式  (2026-10-09, 更新至 zzqAI M1-M6)
// 用法：在控制台执行   exec zzqbot.cfg
//       或在命令行   +devmap q3dm4 +exec zzqbot.cfg
// 说明：3 个 zzqBOT 机器人（最高难度技能 5）+ 伤害数字 + zzqAI 全部六个模块
//===========================================================================

// ---- 伤害数字（由自编译的 cgame.qvm 提供）----
set cg_damageNumbers 1
set cg_damageNumbersScale 1
set cg_damageNumbersDebug 0

// ---- zzqAI M1：对手档案 ----
// 机器人会记住每个对手的常出没区域，丢失敌人后朝最可能的方位搜索。
set bot_profile 1
// 想打印所有玩家的画像报告，把下面这行改成 1（只打印一次）
set bot_profile_debug 0

// ---- zzqAI M2：高价值物品提前占位 ----
// 允许机器人比物品刷新时刻提前这么多秒到达并在原地等待（0 = 关闭）
set bot_item_wait 2
// 打印"提前占位"诊断（会刷屏，平时 0）
set bot_item_wait_diag 0

// ---- zzqAI M3：决斗策略机 ----
// 每帧判断态势（压上 / 对枪 / 脱离）；劣势时不再送人头，而是去补血甲。
set bot_duel 1
// 实时打印态势变化（会刷屏，平时 0）
set bot_duel_debug 0
// 想打印一次全部机器人态势汇总，把下面这行改成 1（只打印一次）
set bot_duel_report 0

// ---- zzqAI M4：战斗走位 ----
// 站在理想交火距离时绕圈横移（原版是原地站桩）；劣势时保持面向敌人后撤。
set bot_duel_move 1

// ---- zzqAI M5：连续自适应难度 ----
// 按每个机器人这一局的得分表现，连续地抬高或压低它的有效 skill
// （不再是固定的 1~5 五档）。打得好的被压低，打得差的被抬高。
set bot_adaptive 1
// 每个评估周期最多移动多少 skill（越大变化越快，也越容易抖）
set bot_adaptive_rate 0.30
// skill 偏移的绝对值上限
set bot_adaptive_range 1.5
// 有效 skill 的上下限
set bot_adaptive_min 1.0
set bot_adaptive_max 5.0
// 评估周期（秒）
set bot_adaptive_interval 6
// 实时打印难度调整（会刷屏，平时 0）
set bot_adaptive_debug 0
// 想打印一次难度伺服汇总，把下面这行改成 1（只打印一次）
set bot_adaptive_report 0

// ---- zzqAI M6：团队情报共享 + 角色化响应 ----
// 注意：这一项只在团队模式（TDM / CTF）下生效；FFA 里没有队友可分享，模块静默。
//       想验证请用：+set g_gametype 3 +devmap q3dm6 +exec m6test.cfg
set bot_share 1
// 一条情报的有效期（秒）
set bot_share_lifetime 8
// 情报响应距离上限
set bot_share_range 2500
// 实时打印收到的情报（会刷屏，平时 0）
set bot_share_debug 0
// 想打印一次团队角色与情报板汇总，把下面这行改成 1（只打印一次）
set bot_share_report 0

// ---- 机器人外观（zzqAI 1.3，CPMA 风格）----
// 这两项属于客户端(cgame)设置，且已经是 mod 的默认值，写在这里只为显式可见。
// cg_enemyModel "pm"  = 所有机器人一律换成 ProMode "亮皮"(brightskin)
// cg_enemyColors "2222" = 染成纯绿（2=绿；顺序为 头/身/腿/color1/color2）
// 想恢复原版花哨外观：两项都 set 成空串。
set cg_enemyModel "pm"
set cg_enemyColors "2222"

// ---- 机器人 ----
set bot_enable 1
set g_spSkill 5

// 注意：以上 bot_* 都是作弊保护 cvar，普通开局改不动它们；
// 想现场调参请用 devmap 开图（自动开启作弊）。

// zzqBOT x3（第 5 个参数是显示用别名，避免重名）
addbot zzqBOT 5 "" 0 ^1zzqBOT^7-^4Alpha
addbot zzqBOT 5 "" 0 ^1zzqBOT^7-^4Beta
addbot zzqBOT 5 "" 0 ^1zzqBOT^7-^4Gamma

echo "^1zzqBOT mode loaded. ^7Damage numbers ON. zzqAI M1-M6 ON. 3 bots added."
