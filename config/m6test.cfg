// zzqAI M6 验证：团队情报共享 + 角色化响应（2026-10-09）
// 用法: quake3e-vulkan.x64.exe +set fs_game brainworks +set logfile 1 +set g_gametype 3 +devmap q3dm6 +exec m6test.cfg
set bot_enable 1
set fraglimit 0
set timelimit 0
set team_autoJoin 1

// 只开 M6，关掉 M5，隔离验证
set bot_adaptive 0

set bot_share 1
set bot_share_debug 1
set bot_share_lifetime 10
set bot_share_range 4000

// 红蓝各两人：一个队里进攻性高的当"突破"，低的当"守点"
addbot zzqBOT 4 red  0 ^1zzqBOT^7-^4Red1
addbot zzqBOT 4 red  0 ^1zzqBOT^7-^4Red2
addbot zzqBOT 4 blue 0 ^4zzqBOT^7-^1Blue1
addbot zzqBOT 4 blue 0 ^4zzqBOT^7-^1Blue2

wait 2200
echo ================ M6 REPORT A ================
bot_share_report 1
wait 60
wait 2200
echo ================ M6 REPORT B ================
bot_share_report 1
wait 60
wait 2200
echo ================ M6 REPORT C ================
bot_share_report 1
wait 60
quit
