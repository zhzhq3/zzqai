// zzqAI M5 验证：连续自适应难度（2026-10-09）
// 用法: quake3e-vulkan.x64.exe +set fs_game brainworks +set logfile 1 +devmap q3dm4 +exec m5test.cfg
set bot_enable 1
set fraglimit 0
set timelimit 0

// 只开 M5，关掉 M6，隔离验证
set bot_share 0

set bot_adaptive 1
set bot_adaptive_debug 1
set bot_adaptive_interval 3
set bot_adaptive_rate 0.30
set bot_adaptive_range 1.5

// 故意放两组不同 skill 的机器人：
//   Low*  初始 skill 2 —— 打不过 High*，得分低，应该被"抬"起来
//   High* 初始 skill 4 —— 打得过 Low*，得分高，应该被"压"下去
// 这是难度伺服的"趋衡"行为，也是 M5 最直观的证据。
addbot zzqBOT 2 "" 0 ^1zzqBOT^7-^4Low1
addbot zzqBOT 2 "" 0 ^1zzqBOT^7-^4Low2
addbot zzqBOT 4 "" 0 ^1zzqBOT^7-^4High1
addbot zzqBOT 4 "" 0 ^1zzqBOT^7-^4High2

wait 2200
echo ================ M5 REPORT A ================
bot_adaptive_report 1
wait 60
wait 2200
echo ================ M5 REPORT B ================
bot_adaptive_report 1
wait 60
wait 2200
echo ================ M5 REPORT C ================
bot_adaptive_report 1
wait 60
quit
