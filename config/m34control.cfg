// zzqAI 对照组：M3/M4 全部关闭，应恢复到原版行为（无态势、无绕圈、无脱离补血）
set bot_enable 1
set g_spSkill 4
set fraglimit 0
set timelimit 0
set bot_duel 0
set bot_duel_move 0
set bot_duel_debug 1
set bot_duel_report 0
addbot zzqBOT 4 "" 0 ^1AI^7-^4One
addbot zzqBOT 4 "" 0 ^1AI^7-^4Two
addbot zzqBOT 4 "" 0 ^1AI^7-^4Three
wait 1500
echo ================ CONTROL REPORT ================
bot_duel_report 1
wait 60
echo ================ CONTROL DONE ================
quit
