// zzqAI M3/M4 验证（2026-10-09）
// 用法: quake3e-vulkan.x64.exe +set fs_game brainworks +set logfile 1 +devmap q3dm4 +exec m3test.cfg
set bot_enable 1
set g_spSkill 4
set fraglimit 0
set timelimit 0

// M3 决斗策略机 + M4 战斗走位
set bot_duel 1
set bot_duel_move 1
set bot_duel_debug 1
set bot_duel_report 0

addbot zzqBOT 4 "" 0 ^1AI^7-^4One
addbot zzqBOT 4 "" 0 ^1AI^7-^4Two
addbot zzqBOT 4 "" 0 ^1AI^7-^4Three

wait 1500
echo ================ M3/M4 REPORT 1 ================
bot_duel_report 1
wait 60
echo ================ CVAR CHECK ================
bot_duel
bot_duel_move
bot_duel_debug
wait 60
wait 1200
echo ================ M3/M4 REPORT 2 ================
bot_duel_report 1
wait 1200
echo ================ M3/M4 REPORT 3 ================
bot_duel_report 1
wait 60
quit
